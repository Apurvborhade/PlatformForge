apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: platformforge

spec:
  replicas: 1

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker

          image: apurvaborhade/platformforge-worker:latest

          env:
            - name: NODE_ENV
              value: production