apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig

metadata:
  name: platformforge-slack
  namespace: platformforge

  labels:
    release: monitoring

spec:
  route:
    receiver: slack

  receivers:
    - name: slack

      slackConfigs:
        - apiURL:
            name: slack-webhook
            key: url

          channel: "#all-devopstest"
          title: '{{ "{{ .CommonLabels.alertname }}" }}'

          text: |
            Severity: {{ "{{ .CommonLabels.severity }}" }}
            {{ "{{ range .Alerts }}" }}
            {{ "{{ .Annotations.summary }}" }}
            {{ "{{ end }}" }}