apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule

metadata:
  name: platformforge-alerts
  namespace: monitoring

  labels:
    release: monitoring

spec:
  groups:
    - name: platformforge
      rules:

        - alert: BackendDown
          expr: up{job="backend-monitor"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: Backend is down

        - alert: PodRestarting
          expr: increase(kube_pod_container_status_restarts_total[5m]) > 0
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Pod restarting frequently

        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total[5m])) by (pod) > 0.8
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: High CPU usage detected