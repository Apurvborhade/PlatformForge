apiVersion: apps/v1
kind: Deployment

metadata:
  name: frontend
  namespace: platformforge

spec:
  replicas: {{ .Values.frontend.replicaCount}}

  selector:
    matchLabels:
      app: frontend

  template:
    metadata:
      labels:
        app: frontend

    spec:
      containers:
        - name: frontend

          image: {{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}

          ports:
            - containerPort: 80

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"

          readinessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80

            initialDelaySeconds: 15
            periodSeconds: 20