apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: platformforge

spec:
  replicas: {{ .Values.backend.replicaCount}}

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend

          image: {{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}


          ports:
            - containerPort: 3001

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

            limits:
              memory: "256Mi"
              cpu: "200m"