apiVersion: apps/v1
kind: Deployment

metadata:
  name: worker
  namespace: platformforge

spec:
  replicas: {{ .Values.worker.replicaCount }}

  selector:
    matchLabels:
      app: worker

  template:
    metadata:
      labels:
        app: worker

    spec:
      containers:
        - name: worker

          image: {{ .Values.worker.image.repository }}:{{ .Values.worker.image.tag }}

          env:
            - name: NODE_ENV
              value: production