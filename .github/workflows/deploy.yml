name: Deplot PlatformForge

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        
      - name: Build frontend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/platformforge-frontend:latest ./apps/frontend

      - name: Push frontend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/platformforge-frontend:latest

      - name: Build backend image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/platformforge-backend:latest ./apps/backend

      - name: Push backend image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/platformforge-backend:latest

      - name: Build worker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/platformforge-worker:latest ./apps/worker

      - name: Push worker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/platformforge-worker:latest