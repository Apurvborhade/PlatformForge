apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platformforge
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Apurvborhade/PlatformForge.git
    targetRevision: HEAD
    path: platformforge

  destination:
    server: https://kubernetes.default.svc
    namespace: platformforge

  syncPolicy:
    automated:
      prune: true
      selfHeal: true